


<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail de Révisions</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#222;
}
.main-container{
    max-width:600px;
    width:100%;
    background:#fff;
    border-radius:22px;
    padding:30px 25px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
    text-align:center;
    margin: 20px 0;
}
h1{color:#4b3f72;margin-bottom:10px;font-size:28px;}
p{color:#666;font-size:16px;margin-bottom:25px;}
.menu-buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-bottom: 30px;
}
.menu-btn{
    background:#4b6cff;
    color:#fff;
    font-size:18px;
    padding:18px;
    border:0;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 4px 15px rgba(75,108,255,0.3);
    text-decoration:none;
    display:block;
    transition:transform 0.2s, background 0.2s;
}
.menu-btn:hover{
    background:#3a58e0;
    transform:translateY(-2px);
}
.menu-btn.grammar{
    background:#764ba2;
    box-shadow:0 4px 15px rgba(118,75,162,0.3);
}
.menu-btn.grammar:hover{
    background:#633a8e;
}

/* Section Avis et Étoiles */
.feedback-section{
    border-top: 2px solid #eee;
    padding-top: 20px;
    text-align: left;
}
.feedback-section h3{
    color: #4b3f72;
    text-align: center;
    margin-bottom: 15px;
}
.form-group{
    margin-bottom: 12px;
}
input, textarea{
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    font-family: Arial, sans-serif;
}
.stars{
    font-size: 28px;
    cursor: pointer;
    color: #ccc;
    display: inline-block;
    margin-bottom: 5px;
    letter-spacing: 5px;
}
.stars span.active{
    color: #ffc107;
}
.submit-avis{
    background: #28a745;
    color: white;
    border: 0;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
}
.submit-avis:hover{background: #218838;}

/* Liste des avis affichés */
.avis-list{
    margin-top: 20px;
    max-height: 250px;
    overflow-y: auto;
    text-align: left;
}
.avis-item{
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    position: relative;
    padding-bottom: 30px;
}
.avis-item strong{color: #4b3f72;}
.avis-stars{color: #ffc107; font-size: 14px;}
.avis-date{font-size: 11px; color: #888; float: right;}
.avis-text{margin-top: 6px; font-size: 14px; color: #333;}
.delete-btn{
    background: #dc3545;
    color: white;
    border: none;
    padding: 5px 10px;
    font-size: 11px;
    border-radius: 4px;
    cursor: pointer;
    position: absolute;
    bottom: 8px;
    right: 8px;
}
.delete-btn:hover{background: #c82333;}
</style>
</head>
<body>

<div class="main-container">
    <h1>🚀 Portail de Révisions</h1>
    <p>Choisis ton activité pour commencer :</p>
    
    <div class="menu-buttons">
        <a href="verbes.html" class="menu-btn">🇬🇧 Quiz Anglais (Verbes irréguliers)</a>
        <a href="grammaire.html" class="menu-btn grammar">📖 Classes grammaticales (Français)</a>
    </div>

    <!-- ESPACE AVIS ET AMÉLIORATIONS -->
    <div class="feedback-section">
        <h3>💬 Améliorations & Avis</h3>
        <div class="form-group">
            <input type="text" id="nomUser" placeholder="Ton prénom...">
        </div>
        <div class="form-group" style="text-align: center;">
            <div class="stars" id="starContainer">
                <span data-value="1">★</span>
                <span data-value="2">★</span>
                <span data-value="3">★</span>
                <span data-value="4">★</span>
                <span data-value="5">★</span>
            </div>
        </div>
        <div class="form-group">
            <textarea id="msgUser" rows="2" placeholder="Dis ce qu'il y a à améliorer..."></textarea>
        </div>
        <button class="submit-avis" onclick="envoyerAvis()">Envoyer mon avis</button>

        <div class="avis-list" id="listeAvis"></div>
    </div>
</div>

<script>
let noteSelectionnee = 5;
const stars = document.querySelectorAll("#starContainer span");

stars.forEach(star => {
    star.addEventListener("click", () => {
        noteSelectionnee = parseInt(star.getAttribute("data-value"));
        updateStars();
    });
});

function updateStars() {
    stars.forEach(s => {
        if (parseInt(s.getAttribute("data-value")) <= noteSelectionnee) {
            s.classList.add("active");
        } else {
            s.classList.remove("active");
        }
    });
}
updateStars();

function chargerAvis() {
    let avis = JSON.parse(localStorage.getItem("siteAvis")) || [];
    let html = "";
    
    if (avis.length === 0) {
        html = "<p style='text-align:center; color:#888; font-size:13px; margin-top:15px;'>Aucun avis pour l'instant. Sois le premier !</p>";
    } else {
        avis.forEach((a, index) => {
            let etoilesStr = "★".repeat(a.note) + "☆".repeat(5 - a.note);
            html += `
                <div class="avis-item">
                    <span class="avis-date">${a.date}</span>
                    <strong>${a.nom}</strong> 
                    <div class="avis-stars">${etoilesStr}</div>
                    <div class="avis-text">${a.msg}</div>
                    <button class="delete-btn" onclick="supprimerAvis(${index})">Supprimer</button>
                </div>
            `;
        });
    }
    document.getElementById("listeAvis").innerHTML = html;
}

function envoyerAvis() {
    let nom = document.getElementById("nomUser").value.trim();
    let msg = document.getElementById("msgUser").value.trim();
    
    if (!nom || !msg) {
        alert("Merci d'écrire ton prénom et ton message !");
        return;
    }

    let maintenant = new Date().toLocaleDateString("fr-FR", {day: 'numeric', month: 'short'});

    let nouveauMessage = {
        nom: nom,
        note: noteSelectionnee,
        msg: msg,
        date: maintenant
    };

    let avis = JSON.parse(localStorage.getItem("siteAvis")) || [];
    avis.unshift(nouveauMessage);
    localStorage.setItem("siteAvis", JSON.stringify(avis));

    document.getElementById("nomUser").value = "";
    document.getElementById("msgUser").value = "";
    noteSelectionnee = 5;
    updateStars();

    chargerAvis();
}

const MOT_DE_PASSE_SECRET = "victor2026";

function supprimerAvis(index) {
    let mdp = prompt("Mot de passe administrateur requis :");
    if (mdp === MOT_DE_PASSE_SECRET) {
        let avis = JSON.parse(localStorage.getItem("siteAvis")) || [];
        avis.splice(index, 1);
        localStorage.setItem("siteAvis", JSON.stringify(avis));
        chargerAvis();
        alert("Message supprimé avec succès !");
    } else if (mdp !== null) {
        alert("Mot de passe incorrect !");
    }
}

chargerAvis();
</script>

</body>
</html>
