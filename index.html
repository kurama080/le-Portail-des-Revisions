<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail de Révisions</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#222;
}
.main-container{
    max-width:500px;
    width:100%;
    background:#fff;
    border-radius:22px;
    padding:40px 30px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
    text-align:center;
}
h1{color:#4b3f72;margin-bottom:10px;font-size:30px;}
p{color:#666;font-size:16px;margin-bottom:30px;}
.menu-buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
}
.menu-btn{
    background:#4b6cff;
    color:#fff;
    font-size:18px;
    padding:18px;
    border:0;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 4px 15px rgba(75,108,255,0.3);
    text-decoration:none;
    display:block;
    transition:transform 0.2s, background 0.2s;
}
.menu-btn:hover{
    background:#3a58e0;
    transform:translateY(-2px);
}
.menu-btn.grammar{
    background:#764ba2;
    box-shadow:0 4px 15px rgba(118,75,162,0.3);
}
.menu-btn.grammar:hover{
    background:#633a8e;
}
</style>
</head>
<body>

<div class="main-container">
    <h1>🚀 Portail de Révisions</h1>
    <p>Choisis ton activité pour commencer :</p>
    <div class="menu-buttons">
        <a href="verbes.html" class="menu-btn">🇬🇧 Quiz Anglais (Verbes irréguliers)</a>
        <a href="grammaire.html" class="menu-btn grammar">📖 Classes grammaticales (Français)</a>
    </div>
</div>

</body>
</html>
